<header class="header">
  <div class="container">
    <nav class="navbar">
      <button class="hamburger mobile-only" (click)="onHamburgerClick()" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="navbar__left">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3c-1.9 0-2.8-1-4.6-1C4.5 2 3 4.5 3 7.2c0 4 2.1 5.1 2.6 9.5.3 2.6 1.2 4.3 2.5 4.3 1.7 0 1.5-4.8 3.9-4.8s2.2 4.8 3.9 4.8c1.3 0 2.2-1.7 2.5-4.3.5-4.4 2.6-5.5 2.6-9.5C21 4.5 19.5 2 16.6 2 14.8 2 13.9 3 12 3Z"></path>
          </svg>
        </div>
        <div class="brand-copy">
          <span class="logo-site">DentisApp</span>
          <span class="workspace-label">Gestión clínica</span>
        </div>
      </div>

      <div class="navbar__center desktop-only" *ngIf="isDentist">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input
            type="text" 
            class="search-input" 
            placeholder="Buscar paciente por nombre o documento" 
            [(ngModel)]="searchTerm"
            (input)="onSearchInput()"
            aria-label="Buscar paciente"
          />
          <div class="search-results" *ngIf="showDropdown">
            <div 
              class="result-item" 
              *ngFor="let patient of searchResults" 
              (click)="openPatientHistory(patient)"
            >
              <span class="patient-name">{{ patient.name || patient.firstName + ' ' + patient.lastName }}</span>
              <span class="patient-cedula">{{ patient.cedula || patient.documentId || patient._id || 'Sin documento' }}</span>
            </div>
          </div>
        </div>
      </div>

      <button class="logout-button" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </nav>
  </div>
</header>
